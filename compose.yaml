services:
  vprodb:
    build:
      context: ./Docker-files/db
      dockerfile: Dockerfile 
    image: puneethkumarv48/vprofiledb
    container_name: vprodb
    ports:
      - "3306:3306"
    volumes: 
      - vprodbdata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=vprodbpass

    # Memcached Service
    vprocache:
      image: memcached
      container_name: vprocache01
      ports:
        - "11211:11211"
    
    # RabbitMQ Service
    vprorabbitmq:
      image: rabbitmq
      container_name: vpromq01
      ports: 
        - "5672:5672"
      environment:
        - RABBITMQ_DEFAULT_PASS=guest
        - RABBITMQ_DEFAULT_USER=guest

    

    #App Service
    vproapp:
    build:
      context: ./Docker-files/app
      dockerfile: Dockerfile 
    image: puneethkumarv48/vprofileapp
    container_name: vproapp
    ports:
      - "8080:8080"
    volumes: 
      - vproappdata:/usr/local/tomcat/webapps/

    #Web Service
    vproweb:
    build:
      context: ./Docker-files/web
      dockerfile: Dockerfile 
    image: puneethkumarv48/vprofileweb
    container_name: vproweb
    ports:
      - "80:80"



volumes:
  vprodbdata: {}
  vproappdata: {}